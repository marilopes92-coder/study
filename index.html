<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Plantão de Estudos</title>
  <meta name="description" content="Estudo diário para enfermeiros em preparação para concursos: tema do dia, técnica Feynman, checklist, questões e lembretes.">
  <meta name="theme-color" content="#0f766e">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <span class="logo" aria-hidden="true">🩺</span>
    <strong>Plantão de Estudos</strong>
  </header>
  <main id="main" tabindex="-1"></main>
  <nav aria-label="Navegação principal">
    <button data-view="hoje"><span aria-hidden="true">☀️</span>Hoje</button>
    <button data-view="conteudo"><span aria-hidden="true">📋</span>Conteúdo</button>
    <button data-view="questoes"><span aria-hidden="true">📝</span>Questões</button>
    <button data-view="config"><span aria-hidden="true">⚙️</span>Ajustes</button>
  </nav>
  <div id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
